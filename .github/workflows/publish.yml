name: Publish

# Publishes on a version tag, for example v1.3.1.
# Auth uses npm trusted publishing (OIDC). No token secret is necessary.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs format, typecheck, tests, and the consumer typecheck.
      - name: Publish to npm
        run: npm publish --provenance
